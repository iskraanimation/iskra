# Vendored from VectorCraft (crates/trace) by scripts/vendor.sh; see ATTRIBUTION.md. Only this manifest is ours:
# the package is renamed and the library keeps its upstream name, so the sources stay unchanged.
[package]
name = "iskra-vectorcraft-trace"
description = "Bitmap to vector tracing: quantise, follow boundaries, fit Béziers (vendored vectorcraft-trace)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# tests/quality is a measuring harness whose counting allocator needs `unsafe`, which the
# workspace forbids, so it is not built here; the other tests are.
autotests = false

[lib]
name = "vectorcraft_trace"

[lints]
workspace = true

[dependencies]
vectorcraft-geom = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "shared_boundaries"
path = "tests/shared_boundaries.rs"
