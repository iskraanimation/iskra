# Vendored from PhotoCraft (crates/raster) by scripts/vendor.sh; see ATTRIBUTION.md. Only this manifest is ours:
# the package is renamed and the library keeps its upstream name, so the sources stay unchanged.
[package]
name = "iskra-photocraft-raster"
description = "Copy-on-write tiled pixel surfaces (vendored photocraft-raster)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "photocraft_raster"

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
serde = { workspace = true }

# Native only: converting a region's tiles is independent per tile, so it runs on all cores.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
