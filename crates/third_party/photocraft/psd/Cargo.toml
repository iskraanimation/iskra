# Vendored from PhotoCraft (crates/psd) by scripts/vendor.sh; see ATTRIBUTION.md. Only this manifest is ours:
# the package is renamed and the library keeps its upstream name, so the sources stay unchanged.
[package]
name = "iskra-photocraft-psd"
description = "Reader and writer for Photoshop PSD and PSB files and brush files (vendored photocraft-psd)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "photocraft_psd"

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in upstream). They fail when the corpus is missing.
corpus = []
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
photocraft-psd = { package = "iskra-photocraft-psd", path = ".", features = ["testgen"] }
